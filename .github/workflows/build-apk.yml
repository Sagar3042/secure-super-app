name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies with Legacy Peer Deps
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest @codetrix-studio/capacitor-google-auth@latest --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Setup Capacitor Layout
        run: |
          npx cap init "SecureConnect Pro" "com.sagar.secureconnect" --web-dir dist
          npx cap add android

      - name: Configure Native Google Client ID
        run: |
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings_google.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="server_client_id">APNAR_WEB_CLIENT_ID_EKHANE_DIN</string>
          </resources>
          EOF

      - name: Generate google-services.json for Firebase Auth
        run: |
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "846601072766",
              "project_id": "chocod-bd9e8"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:846601072766:android:e30d30fdbc25444b2ba82f",
                  "android_client_info": {
                    "package_name": "com.sagar.secureconnect"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "846601072766-6cukiaaln0s6k8lrv0o0ejgbi0vnje8j.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBrbpMraMdVb934KUxiAfFA5PM7YZcdL2k"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Native Anti-Screenshot (FLAG_SECURE)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/sagar/secureconnect/MainActivity.java
          package com.sagar.secureconnect;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              }
          }
          EOF

      - name: Display SHA-1 Fingerprint Safely
        run: |
          echo "=== COPY THIS EXACT SHA-1 TO YOUR FIREBASE CONSOLE ==="
          keytool -list -v -keystore sagar.keystore -alias securealias -storepass sagar123 | grep -i sha1 || true
          echo "========================================================"

      - name: Compile Secure Release APK with Fixed Local Keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=../sagar.keystore -Pandroid.injected.signing.store.password=sagar123 -Pandroid.injected.signing.key.alias=securealias -Pandroid.injected.signing.key.password=sagar123
          cp app/build/outputs/apk/debug/app-debug.apk ../SecureConnectPro.apk

      - name: Upload Signed Production App
        uses: actions/upload-artifact@v4
        with:
          name: SecureConnect-Pro-APK
          path: SecureConnectPro.apk

