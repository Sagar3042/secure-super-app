name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest

      - name: Build React App
        run: npm run build

      - name: Setup Capacitor Layout
        run: |
          npx cap init "SecureConnect Pro" "com.sagar.secureconnect" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Inject Native Anti-Screenshot (FLAG_SECURE)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/sagar/secureconnect/MainActivity.java
          package com.sagar.secureconnect;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Bypasses screen capture, video recording, and recent app previews globally
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              }
          }
          EOF

      - name: Generate Secure Build Keystore
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias securealias -keyalg RSA -keysize 2048 -validity 10000 -storepass sagar123 -keypass sagar123 -dname "CN=Sagar Paul, OU=Production, O=SagarApp, L=Barasat, S=WestBengal, C=IN"

      - name: Display SHA-1 Fingerprint for Firebase Integration
        run: |
          cd android
          echo "=== COPY THIS SHA-1 TO YOUR FIREBASE CONSOLE ==="
          keytool -list -v -keystore release.keystore -alias securealias -storepass sagar123 | grep SHA1
          echo "================================================"

      - name: Compile Secure Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SecureConnectPro.apk

      - name: Upload Signed Production App
        uses: actions/upload-artifact@v4
        with:
          name: SecureConnect-Pro-APK
          path: SecureConnectPro.apk

