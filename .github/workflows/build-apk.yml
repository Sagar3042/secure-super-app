name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest

      - name: Build React App
        run: npm run build

      - name: Setup Capacitor with Unique Package Name
        run: |
          npx cap init "SecureConnect Pro" "com.sagar.secureconnect" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate Self-Signed Keystore for Play Protect Bypass
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias securealias -keyalg RSA -keysize 2048 -validity 10000 -storepass sagar123 -keypass sagar123 -dname "CN=Sagar Paul, OU=Development, O=SagarApp, L=Barasat, S=WestBengal, C=IN"

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # Copy the built apk to local directory for staging
          cp app/build/outputs/apk/debug/app-debug.apk ../SecureConnectPro.apk

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureConnect-Pro-APK
          path: SecureConnectPro.apk
